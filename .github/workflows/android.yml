name: Android APK

# Builds the SadakWatch Android app on every change and publishes an
# installable APK:
#   * push to main  -> rolling pre-release "android-latest"
#                      https://github.com/<owner>/<repo>/releases/download/android-latest/sadakwatch.apk
#   * tag v*        -> versioned release with the APK attached
#   * other pushes and PRs -> APK available as a workflow artifact
#
# Release signing: add repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
# Without them the APK is signed with the repository's debug key, which is
# fine for testing but must not be used for public distribution.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION="0.2.${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/sadakwatch.apk
          cp app/build/outputs/apk/release/app-release.apk "../dist/sadakwatch-${VERSION}.apk"
          sha256sum ../dist/*.apk
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_B64" ]; then echo "signing=release key" >> "$GITHUB_OUTPUT"; else echo "signing=debug key (testing only)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: sadakwatch-apk-${{ steps.apk.outputs.version }}
          path: dist/sadakwatch-${{ steps.apk.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish rolling "android-latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/sadakwatch.apk "dist/sadakwatch-${{ steps.apk.outputs.version }}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "SadakWatch Android ${{ steps.apk.outputs.version }} (latest main)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Signed with: ${{ steps.apk.outputs.signing }}. Install sadakwatch.apk on Android 8.0+ (allow installs from your browser when prompted)."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/sadakwatch.apk --title "SadakWatch $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/sadakwatch.apk --clobber
