name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api
      - name: Build edge agent
        run: go build ./cmd/edge-agent
