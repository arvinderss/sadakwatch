services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: sadakwatch
      POSTGRES_USER: sadakwatch
      POSTGRES_PASSWORD: sadakwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadakwatch -d sadakwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
